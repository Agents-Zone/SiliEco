<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阶段模板编辑器 · 交互原型</title>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --sub:#475569; --mute:#64748b;
    --line:#e2e8f0; --line2:#cbd5e1;
    --primary:#0e7490; --primary-d:#155e75; --primary-bg:#ecfeff; --primary-l:#cffafe;
    --ok:#15803d; --ok-bg:#f0fdf4;
    --gate:#b45309; --gate-bg:#fffbeb; --gate-l:#fde68a;
    --back:#c2410c;
    --soft:#f8fafc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  header{flex:0 0 auto; background:#0f172a; color:#e2e8f0; padding:12px 22px;
         display:flex; align-items:center; gap:18px; box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .brand{font-weight:700; font-size:15px; letter-spacing:.02em}
  .brand span{color:#67e8f9}
  .brand small{font-weight:400; color:#94a3b8; font-size:12px; margin-left:8px}
  .preset{margin-left:auto; display:flex; align-items:center; gap:10px}
  .preset label{font-size:12px; color:#94a3b8}
  .preset select{background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:6px;
                 padding:5px 10px; font-size:13px; outline:none}
  .preset select:focus{border-color:#67e8f9}
  .btn-save{background:#0e7490; color:#fff; border:0; border-radius:6px; padding:6px 16px;
            font-size:13px; font-weight:600; cursor:pointer}
  .btn-save:hover{background:#155e75}

  main{flex:1 1 auto; display:flex; min-height:0}
  .side{flex:0 0 440px; background:var(--panel); border-right:1px solid var(--line);
        overflow-y:auto; padding:16px 16px 24px}
  .board-wrap{flex:1 1 auto; overflow-y:auto; padding:18px 22px; background:var(--bg)}

  .stitle{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
          color:var(--mute); margin:18px 4px 8px}
  .stitle:first-child{margin-top:4px}

  .field{margin:8px 0}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:4px}
  input[type=text]{width:100%; border:1px solid var(--line2); border-radius:7px; padding:7px 10px;
                    font-size:13px; outline:none; background:#fff; color:var(--ink); font-family:inherit}
  input[type=text]:focus{border-color:#67e8f9; box-shadow:0 0 0 3px rgba(103,232,249,.18)}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .opt{font-weight:400; color:var(--mute); font-size:10.5px}
  .hint{font-size:11px; color:var(--mute); margin-top:4px; line-height:1.5}

  .stage{border:1px solid var(--line); border-radius:11px; background:var(--soft); margin:10px 0; overflow:hidden}
  .stage.has-gate{border-color:var(--gate-l); background:#fffbeb}
  .stage-head{display:flex; align-items:center; gap:8px; padding:9px 10px; border-bottom:1px solid var(--line)}
  .stage.has-gate .stage-head{border-bottom-color:var(--gate-l)}
  .stage-no{flex:0 0 22px; height:22px; border-radius:6px; background:var(--primary); color:#fff;
            font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center}
  .stage.has-gate .stage-no{background:var(--gate)}
  .stage-name{flex:1 1 auto; border:0; background:transparent; font-size:14px; font-weight:600;
              color:var(--ink); padding:3px 6px; border-radius:5px; outline:none; min-width:0; font-family:inherit}
  .stage-name:focus{background:#fff; box-shadow:0 0 0 2px var(--primary-l)}
  .icon-btn{flex:0 0 auto; width:26px; height:26px; border-radius:6px; border:1px solid var(--line2);
            background:#fff; cursor:pointer; color:var(--sub); font-size:13px; line-height:1; padding:0;
            display:flex; align-items:center; justify-content:center}
  .icon-btn:hover{background:var(--soft); color:var(--ink)}
  .icon-btn.del:hover{background:#fef2f2; color:#dc2626; border-color:#fecaca}
  .icon-btn:disabled{opacity:.35; cursor:not-allowed}
  .stage-body{padding:10px}
  .sub-label{font-size:11px; color:var(--mute); margin:10px 0 5px; font-weight:600}

  /* 状态 chips */
  .chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 9px;
        border-radius:14px; cursor:pointer; user-select:none; border:1px solid transparent; line-height:1.5}
  .chip .d{width:8px; height:8px; border-radius:50%; flex:0 0 auto}
  .chip.on{background:#fff; border-color:currentColor}
  .chip.on .d{background:currentColor}
  .chip.on .x{font-style:normal; opacity:.45; margin-left:1px; font-size:14px; line-height:1}
  .chip.on:hover .x{opacity:1; color:#dc2626}
  .chip.add{color:var(--mute); border:1px dashed var(--line2); background:var(--soft)}
  .chip.add:hover{color:var(--primary-d); border-color:var(--primary-l); background:var(--primary-bg)}
  .status-custom{margin-top:7px}
  .status-custom input{font-size:12px; padding:5px 9px}

  /* 门控 */
  .gate-row{display:flex; align-items:center; gap:8px; margin-top:12px;
            padding:8px 10px; border-radius:8px; background:#fff; border:1px dashed var(--line2)}
  .stage.has-gate .gate-row{background:#fff7ed; border-style:solid; border-color:var(--gate-l)}
  .toggle{position:relative; width:34px; height:19px; flex:0 0 auto}
  .toggle input{opacity:0; width:0; height:0}
  .toggle i{position:absolute; inset:0; background:#cbd5e1; border-radius:10px; transition:.15s; cursor:pointer}
  .toggle i:before{content:""; position:absolute; width:15px; height:15px; border-radius:50%; background:#fff;
                   top:2px; left:2px; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .toggle input:checked + i{background:var(--gate)}
  .toggle input:checked + i:before{transform:translateX(15px)}
  .gate-row label{font-size:12px; color:var(--sub); font-weight:600}
  .gate-detail{margin-top:8px; display:none}
  .stage.has-gate .gate-detail{display:block}
  .dtypes{display:flex; flex-wrap:wrap; gap:14px; margin:4px 0 8px}
  .dtype{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--sub); cursor:pointer}
  .dtype input{margin:0}
  .dtype input:checked + span{color:var(--gate); font-weight:600}
  .dt-line{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--sub); margin-top:8px; cursor:pointer}
  .dt-line input{margin:0}
  .gate-hint{font-size:11px; color:var(--gate); background:#fff; border:1px solid var(--gate-l);
             border-radius:6px; padding:6px 9px; margin-top:8px; line-height:1.55}

  .add-stage{width:100%; border:1px dashed var(--line2); background:#fff; border-radius:10px;
             padding:11px; font-size:13px; color:var(--primary-d); cursor:pointer; font-weight:600; margin-top:6px}
  .add-stage:hover{background:var(--primary-bg); border-color:var(--primary-l)}

  /* Board */
  .board-head{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap}
  .board-head h2{font-size:17px; margin:0}
  .board-head .meta{font-size:12px; color:var(--mute)}
  .board-head .live{font-size:11px; color:var(--ok); background:var(--ok-bg); padding:2px 9px;
                    border-radius:10px; font-weight:600; display:inline-flex; align-items:center; gap:5px}
  .board-head .live:before{content:""; width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block}

  .board{display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; min-height:280px}
  .col{flex:0 0 190px; background:var(--soft); border:1px solid var(--line); border-radius:11px;
       display:flex; flex-direction:column; min-height:240px}
  .col.gate{background:var(--gate-bg); border-color:var(--gate-l)}
  .col-head{padding:9px 11px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px}
  .col.gate .col-head{border-bottom-color:var(--gate-l)}
  .col-head .cn{font-size:13px; font-weight:700; color:var(--ink); flex:1; line-height:1.3}
  .col.gate .col-head .cn{color:var(--gate)}
  .col-head .lock{font-size:13px}
  .col-no{font-size:10px; color:var(--mute); font-weight:700; background:#fff; border:1px solid var(--line);
          border-radius:5px; padding:1px 5px}
  .col.gate .col-no{background:#fef3c7; border-color:var(--gate-l); color:var(--gate)}
  .col-status{padding:7px 11px 3px; display:flex; flex-wrap:wrap; gap:5px}
  .col-status .sc{display:inline-flex; align-items:center; gap:4px; font-size:10px; color:var(--mute);
                  background:#fff; border:1px solid var(--line); border-radius:8px; padding:2px 6px}
  .col-status .sc .d{width:6px; height:6px; border-radius:50%}
  .col-body{padding:6px 8px 10px; display:flex; flex-direction:column; gap:6px; flex:1}
  .card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:12px}
  .col.gate .card{border-color:var(--gate-l)}
  .card .ct{color:var(--ink); font-weight:600; line-height:1.35}
  .card .cs{margin-top:5px; font-size:10.5px; color:var(--mute); display:inline-flex; align-items:center; gap:4px}
  .card .cs .d{width:7px; height:7px; border-radius:50%}
  .gate-card{margin-top:auto; padding:7px 9px; font-size:10.5px; color:var(--gate); font-weight:600;
             border:1px dashed var(--gate-l); border-radius:7px; background:transparent; line-height:1.5}
  .empty-col{color:var(--mute); font-size:11px; padding:10px; text-align:center}
  .board-empty{flex:1; display:flex; align-items:center; justify-content:center; color:var(--mute);
               font-size:13px; border:1px dashed var(--line2); border-radius:11px; background:#fff}

  .map-note{margin-top:16px; padding:11px 14px; background:#fff; border:1px solid var(--line); border-radius:9px;
            font-size:12px; color:var(--sub); line-height:1.8}
  .map-note b{color:var(--primary-d)}

  .json-bar{flex:0 0 auto; background:#0f172a; color:#cbd5e1; border-top:1px solid #1e293b;
            font-family:"SF Mono",Consolas,monospace; font-size:11.5px}
  .json-toggle{width:100%; text-align:left; background:#0f172a; color:#94a3b8; border:0; padding:9px 22px;
               cursor:pointer; font-size:12px; font-family:inherit; display:flex; align-items:center; gap:8px}
  .json-toggle:hover{color:#e2e8f0}
  .json-toggle b{color:#67e8f9; font-weight:600}
  .json-toggle .arr{margin-left:auto}
  .json-code{margin:0; padding:0 22px 16px; max-height:220px; overflow:auto; white-space:pre; line-height:1.6}
  .json-code .k{color:#7dd3fc} .json-code .s{color:#86efac}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
         background:#0f172a; color:#fff; padding:11px 22px; border-radius:9px; font-size:13px;
         opacity:0; transition:.25s; pointer-events:none; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="brand">CoMach <span>·</span> 阶段模板编辑器 <small>交互原型</small></div>
  <div class="preset">
    <label>载入预设</label>
    <select id="presetSel">
      <option value="投标模板">投标模板</option>
      <option value="软件开发">软件开发</option>
      <option value="Bug修复">Bug 修复</option>
      <option value="通用文档">通用文档协作</option>
      <option value="空白">空白（从零开始）</option>
    </select>
    <button class="btn-save" id="saveBtn">保存模板</button>
  </div>
</header>

<main>
  <aside class="side" id="panel"></aside>
  <section class="board-wrap">
    <div class="board-head">
      <h2 id="boardTitle">看板预览</h2>
      <span class="meta" id="boardMeta"></span>
      <span class="live">实时同步</span>
    </div>
    <div class="board" id="board"></div>
    <div class="map-note">
      看板的<b>列</b>来自模板阶段；卡片上的<b>状态标记</b>来自每个阶段的状态集合，可自定义增删；标 <b>🔒</b> 的列挂着门控，出列需决策才能放行，决策人可以是<b>人</b>，也可以是 <b>Self Agent</b>（自主评审通过即自动放行，高权限除外）。左侧任何改动，右侧即时重生成。
    </div>
  </section>
</main>

<div class="json-bar">
  <button class="json-toggle" id="jsonToggle">
    <span>模板配置数据</span><b id="jsonLabel">（研发可见的数据模型）</b><span class="arr" id="jsonArr">展开 ▾</span>
  </button>
  <pre class="json-code" id="jsonCode" style="display:none"></pre>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== 预置状态候选 + 标签/颜色 ========== */
const STATUS_LABEL = {todo:"未开始", doing:"执行中", done:"已完成", in_review:"待审查", blocked:"阻塞", in_progress:"进行中"};
const STATUS_COLOR = {todo:"#94a3b8", doing:"#fbbf24", done:"#4ade80", in_review:"#a78bfa", blocked:"#f87171", in_progress:"#fbbf24"};
const ALL_STATUSES = ["todo","doing","done","in_review","blocked"];
const statusLabel = n => STATUS_LABEL[n] || n;
const statusColor = n => STATUS_COLOR[n] || "#38bdf8"; // 自定义状态用天蓝

/* ========== 门控决策人类型 ========== */
const DECIDER_DEFAULT = {human:"@bid-lead", self_agent:"@self", agent:"@review-agent"};
const DECIDER_LABEL   = {human:"人工决策", self_agent:"Self Agent 自动评审", agent:"指定 Agent 评审"};

function gate(stage){
  return { on:false, deciderType:"human", decider:"", requireHuman:false, ...stage };
}

/* ========== 预设模板 ========== */
const PRESETS = {
  "投标模板": {
    name:"投标模板", source:"platform-preset", scope:"全部项目",
    stages:[
      {name:"招标文件分析", statuses:["todo","doing","done"], input:"招标公告.pdf", output:"分析报告.md", skills:["招标文件解析","得分点提取"], gate:gate({on:false})},
      {name:"投标方案制定", statuses:["todo","doing","done"], input:"分析报告.md", output:"投标方案.md", skills:["方案撰写"], gate:gate({on:false})},
      {name:"投标标书编写", statuses:["todo","doing","done"], input:"投标方案.md", output:"技术标.md / 商务标.md", skills:["标书生成"], gate:gate({on:false})},
      {name:"审核校验",     statuses:["todo","in_review","done"], input:"技术标.md / 商务标.md", output:"审核意见.md", skills:["合规校验"],
        gate:gate({on:true, deciderType:"human", decider:"@bid-lead", requireHuman:true})},
      {name:"得分点比较",   statuses:["todo","doing","done"], input:"全部产出物", output:"得分分析.md", skills:["得分点提取"], gate:gate({on:false})},
    ]
  },
  "软件开发": {
    name:"软件开发模板", source:"platform-preset", scope:"全部项目",
    stages:[
      {name:"需求设计", statuses:["todo","doing","done"], input:"产品需求", output:"PRD.md", skills:["需求拆解"], gate:gate({on:false})},
      {name:"架构设计", statuses:["todo","doing","done"], input:"PRD.md", output:"架构文档.md / API 设计.md", skills:["架构设计","接口设计"], gate:gate({on:false})},
      {name:"开发实现", statuses:["todo","doing","in_review","done"], input:"架构文档.md", output:"代码 + 单元测试", skills:["编码","TDD"],
        gate:gate({on:true, deciderType:"self_agent", decider:"@self", requireHuman:false})},
      {name:"E2E 测试", statuses:["todo","doing","done"], input:"代码", output:"测试报告.md", skills:["e2e 测试"], gate:gate({on:false})},
      {name:"发布验收", statuses:["todo","doing","done"], input:"测试报告.md", output:"发布说明.md", skills:["发布"],
        gate:gate({on:true, deciderType:"human", decider:"@pm", requireHuman:true})},
    ]
  },
  "Bug修复": {
    name:"Bug 修复模板", source:"platform-preset", scope:"全部项目",
    stages:[
      {name:"问题复现与定位", statuses:["todo","doing","done"], input:"bug 描述", output:"根因分析.md", skills:["调试"], gate:gate({on:false})},
      {name:"修复实现",       statuses:["todo","doing","done"], input:"根因分析.md", output:"修复代码 + 单元测试", skills:["编码"], gate:gate({on:false})},
      {name:"验证确认",       statuses:["todo","in_review","done"], input:"修复代码", output:"验证报告.md", skills:["测试"],
        gate:gate({on:true, deciderType:"self_agent", decider:"@self", requireHuman:false})},
    ]
  },
  "通用文档": {
    name:"通用文档协作模板", source:"platform-preset", scope:"全部项目",
    stages:[
      {name:"大纲设计", statuses:["todo","doing","done"], input:"需求说明", output:"大纲.md", skills:[], gate:gate({on:false})},
      {name:"内容撰写", statuses:["todo","doing","done"], input:"大纲.md", output:"正文.md", skills:[], gate:gate({on:false})},
      {name:"评审修订", statuses:["todo","in_review","done"], input:"正文.md", output:"修订版.md", skills:[],
        gate:gate({on:true, deciderType:"agent", decider:"@review-agent", requireHuman:false})},
      {name:"审核定稿", statuses:["todo","doing","done"], input:"修订版.md", output:"终稿.md", skills:[], gate:gate({on:false})},
    ]
  },
  "空白": { name:"新模板", source:"user", scope:"当前项目", stages:[] }
};

let state = JSON.parse(JSON.stringify(PRESETS["投标模板"]));
let seq = 1000;
let pendingFocus = null;
state.stages.forEach(s => s.id = ++seq);

/* ========== 渲染：左侧配置面板 ========== */
function renderPanel(){
  const p = document.getElementById('panel');
  let h = '';
  h += `<div class="stitle">模板信息</div>`;
  h += `<div class="field"><label>模板名称</label><input type="text" data-f="name" value="${esc(state.name)}"></div>`;
  h += `<div class="row2">
          <div class="field"><label>来源</label><input type="text" data-f="source" value="${esc(state.source)}"></div>
          <div class="field"><label>适用范围</label><input type="text" data-f="scope" value="${esc(state.scope)}"></div>
        </div>`;

  h += `<div class="stitle">阶段列表（${state.stages.length}）</div>`;
  state.stages.forEach((s, i) => {
    const gc = s.gate.on ? 'has-gate' : '';
    const dt = s.gate.deciderType;
    h += `<div class="stage ${gc}" data-id="${s.id}">
      <div class="stage-head">
        <div class="stage-no">${i+1}</div>
        <input type="text" class="stage-name" data-id="${s.id}" data-f="name" value="${esc(s.name)}" placeholder="阶段名称">
        <button class="icon-btn" data-act="up" data-id="${s.id}" ${i===0?'disabled':''} title="上移">↑</button>
        <button class="icon-btn" data-act="down" data-id="${s.id}" ${i===state.stages.length-1?'disabled':''} title="下移">↓</button>
        <button class="icon-btn del" data-act="del" data-id="${s.id}" title="删除">×</button>
      </div>
      <div class="stage-body">

        <div class="sub-label">状态集合 <span class="opt">（事项在此阶段可处的状态，可自定义）</span></div>
        <div class="chips">
          ${s.statuses.map(st => `
            <span class="chip on" style="color:${statusColor(st)}" data-act="del-status" data-id="${s.id}" data-status="${esc(st)}" title="点击移除">
              <span class="d"></span>${statusLabel(st)}<i class="x">×</i>
            </span>`).join('')}
        </div>
        <div class="chips" style="margin-top:6px">
          ${ALL_STATUSES.filter(st=>!s.statuses.includes(st)).map(st => `
            <span class="chip add" data-act="add-status" data-id="${s.id}" data-status="${st}">
              <span class="d" style="background:${statusColor(st)}"></span>+ ${statusLabel(st)}
            </span>`).join('')}
        </div>
        <div class="status-custom">
          <input type="text" data-act="custom-status" data-id="${s.id}" placeholder="+ 自定义状态名，回车添加">
        </div>

        <div class="sub-label">默认输入 / 输出产物 <span class="opt">（可选，默认值，事项实例化时可覆盖）</span></div>
        <div class="row2">
          <input type="text" data-id="${s.id}" data-f="input" value="${esc(s.input)}" placeholder="默认输入文件">
          <input type="text" data-id="${s.id}" data-f="output" value="${esc(s.output)}" placeholder="默认输出文件">
        </div>

        <div class="sub-label">所需 Skills <span class="opt">（逗号分隔）</span></div>
        <input type="text" data-id="${s.id}" data-f="skills" value="${esc(s.skills.join(', '))}" placeholder="如：招标文件解析, 得分点提取">

        <div class="gate-row">
          <label class="toggle"><input type="checkbox" data-act="gate" data-id="${s.id}" ${s.gate.on?'checked':''}><i></i></label>
          <label>出阶段挂门控（需决策才能放行）</label>
        </div>
        <div class="gate-detail">
          <div class="sub-label" style="margin-top:8px">决策人 <span class="opt">（可由 Agent 替代人工评审）</span></div>
          <div class="dtypes">
            ${["human","self_agent","agent"].map(t => `
              <label class="dtype"><input type="radio" name="dt-${s.id}" data-act="deciderType" data-id="${s.id}" data-val="${t}" ${dt===t?'checked':''}><span>${DECIDER_LABEL[t]}</span></label>
            `).join('')}
          </div>
          <input type="text" data-id="${s.id}" data-f="decider" value="${esc(s.gate.decider)}" placeholder="${DECIDER_DEFAULT[dt]}">
          <label class="dt-line"><input type="checkbox" data-act="requireHuman" data-id="${s.id}" ${s.gate.requireHuman?'checked':''}> 强制人工（高权限门控必须由人确认，覆盖 Agent 决策）</label>
          <div class="gate-hint">${gateHint(s)}</div>
        </div>

      </div>
    </div>`;
  });
  h += `<button class="add-stage" data-act="add">+ 添加阶段</button>`;
  p.innerHTML = h;

  if(pendingFocus !== null){
    const el = p.querySelector(`input[data-act="custom-status"][data-id="${pendingFocus}"]`);
    if(el) el.focus();
    pendingFocus = null;
  }
}

function gateHint(s){
  const g = s.gate;
  const who = g.decider || DECIDER_DEFAULT[g.deciderType] || '决策人';
  const force = g.requireHuman ? '；此项为高权限，最终须人工确认' : '';
  if(g.deciderType === 'self_agent') return `由 Self Agent 自主评审本阶段产物，通过则自动放行，无需人工介入${force}`;
  if(g.deciderType === 'agent')      return `由 ${esc(who)} 评审，结果经其所有者审计${force}`;
  return `需 ${esc(who)} 查看产物后人工决策${force}`;
}

/* ========== 渲染：右侧看板 ========== */
function renderBoard(){
  document.getElementById('boardTitle').textContent = state.name + ' · 看板';
  document.getElementById('boardMeta').textContent = state.stages.length + ' 个阶段 · 来源 ' + state.source;
  const b = document.getElementById('board');
  if(state.stages.length === 0){
    b.innerHTML = `<div class="board-empty">还没有阶段。在左侧点「+ 添加阶段」，或载入预设，看板将在此生成。</div>`;
    return;
  }
  let h = '';
  state.stages.forEach((s, i) => {
    const g = s.gate.on;
    h += `<div class="col ${g?'gate':''}">
      <div class="col-head">
        <span class="col-no">${i+1}</span>
        <span class="cn">${esc(s.name)}</span>
        ${g?'<span class="lock">🔒</span>':''}
      </div>
      <div class="col-status">
        ${s.statuses.map(st=>`<span class="sc"><span class="d" style="background:${statusColor(st)}"></span>${statusLabel(st)}</span>`).join('') || '<span class="sc" style="color:#cbd5e1">无状态</span>'}
      </div>
      <div class="col-body">
        ${sampleCards(s,i) || '<div class="empty-col">（无示例卡片）</div>'}
        ${g?`<div class="gate-card">${boardGateHint(s)}</div>`:''}
      </div>
    </div>`;
  });
  b.innerHTML = h;
}

function boardGateHint(s){
  const g = s.gate, who = g.decider || DECIDER_DEFAULT[g.deciderType] || '决策人';
  const force = g.requireHuman ? '（高权限，须人工确认）' : '';
  if(g.deciderType === 'self_agent') return `⚠ 出列由 Self Agent 自动评审${force}`;
  if(g.deciderType === 'agent')      return `⚠ 出列由 ${esc(who)} 评审${force}`;
  return `⚠ 出列需 ${esc(who)} 人工决策${force}`;
}

const SAMPLE_TITLES = ["政务云迁移标书","商务报价复核","接口联调","需求澄清","架构评审","标书章节三","用例补充","得分点核对"];
function sampleCards(s, idx){
  if(s.statuses.length === 0) return '';
  const want = Math.min(2, s.statuses.length);
  let out = '';
  for(let k=0;k<want;k++){
    const st = s.statuses[Math.min(k+1, s.statuses.length-1)] || s.statuses[0];
    const title = SAMPLE_TITLES[(idx+k) % SAMPLE_TITLES.length];
    out += `<div class="card"><div class="ct">${title}</div>
      <div class="cs"><span class="d" style="background:${statusColor(st)}"></span>${statusLabel(st)}</div></div>`;
  }
  return out;
}

/* ========== 渲染：JSON ========== */
function renderJSON(){
  const code = document.getElementById('jsonCode');
  const obj = { name:state.name, source:state.source, scope:state.scope,
    stages: state.stages.map(s => {
      const o = { name:s.name, statuses:s.statuses, defaultInput:s.input||null, defaultOutput:s.output||null, skills:s.skills };
      o.gate = s.gate.on ? { deciderType:s.gate.deciderType, decider:s.gate.decider, requireHuman:s.gate.requireHuman } : null;
      return o;
    }) };
  const raw = JSON.stringify(obj, null, 2);
  code.innerHTML = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/"([^"]+)":/g,'<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>');
}

function renderAll(){ renderPanel(); renderBoard(); renderJSON(); }
function renderLite(){ renderBoard(); renderJSON(); }

/* ========== 工具 ========== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getStage(id){ return state.stages.find(s=>s.id===id); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ========== 事件 ========== */
// 文本输入（只刷右侧 + JSON，避免输入框失焦）
document.getElementById('panel').addEventListener('input', e => {
  const t = e.target, f = t.dataset.f;
  if(t.dataset.id === undefined){
    if(f==='name') state.name = t.value;
    else if(f==='source') state.source = t.value;
    else if(f==='scope') state.scope = t.value;
    return renderLite();
  }
  const s = getStage(+t.dataset.id); if(!s) return;
  if(f==='name') s.name = t.value;
  else if(f==='input') s.input = t.value;
  else if(f==='output') s.output = t.value;
  else if(f==='skills') s.skills = t.value.split(',').map(x=>x.trim()).filter(Boolean);
  else if(f==='decider') s.gate.decider = t.value;
  renderLite();
});

// 自定义状态：回车添加
document.getElementById('panel').addEventListener('keydown', e => {
  if(e.key!=='Enter') return;
  const t = e.target;
  if(t.dataset.act !== 'custom-status') return;
  const val = t.value.trim(); if(!val) return;
  const s = getStage(+t.dataset.id); if(!s) return;
  if(!s.statuses.includes(val)) s.statuses.push(val);
  pendingFocus = s.id;
  renderAll();
});

// 点击类：增删阶段、排序、状态增删
document.getElementById('panel').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.dataset.act, id = +btn.dataset.id;
  if(act==='add'){
    state.stages.push({ id:++seq, name:'新阶段', statuses:['todo','doing','done'], input:'', output:'', skills:[], gate:gate({}) });
    renderAll();
    document.getElementById('panel').scrollTop = document.getElementById('panel').scrollHeight;
    return;
  }
  const s = getStage(id);
  if(act==='up'){ const i=state.stages.indexOf(s); if(i>0){ [state.stages[i-1],state.stages[i]]=[state.stages[i],state.stages[i-1]]; } }
  else if(act==='down'){ const i=state.stages.indexOf(s); if(i<state.stages.length-1){ [state.stages[i+1],state.stages[i]]=[state.stages[i],state.stages[i+1]]; } }
  else if(act==='del'){ state.stages.splice(state.stages.indexOf(s),1); }
  else if(act==='add-status'){ if(s && !s.statuses.includes(btn.dataset.status)) s.statuses.push(btn.dataset.status); }
  else if(act==='del-status'){ if(s && s.statuses.length>1) s.statuses = s.statuses.filter(x=>x!==btn.dataset.status); }
  renderAll();
});

// 变更类：门控开关、决策人类型、强制人工
document.getElementById('panel').addEventListener('change', e => {
  const t = e.target, act = t.dataset.act; if(!act) return;
  const s = getStage(+t.dataset.id); if(!s && act!=='deciderType' && act!=='gate' && act!=='requireHuman') return;
  if(act==='gate') s.gate.on = t.checked;
  else if(act==='requireHuman') s.gate.requireHuman = t.checked;
  else if(act==='deciderType'){
    s.gate.deciderType = t.dataset.val;
    s.gate.decider = DECIDER_DEFAULT[t.dataset.val] || '';
  }
  renderAll();
});

document.getElementById('presetSel').addEventListener('change', e => {
  state = JSON.parse(JSON.stringify(PRESETS[e.target.value]));
  state.stages.forEach(s => s.id = ++seq);
  renderAll();
  toast('已载入：' + e.target.value);
});

document.getElementById('saveBtn').addEventListener('click', () => {
  toast('模板「' + state.name + '」已保存（原型演示）');
  document.getElementById('jsonCode').style.display='block';
  document.getElementById('jsonArr').textContent='收起 ▴';
});

document.getElementById('jsonToggle').addEventListener('click', () => {
  const c = document.getElementById('jsonCode');
  const show = c.style.display==='none' || !c.style.display;
  c.style.display = show?'block':'none';
  document.getElementById('jsonArr').textContent = show?'收起 ▴':'展开 ▾';
});

renderAll();
</script>
</body>
</html>
