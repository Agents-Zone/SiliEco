name: silieco

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: silieco
      POSTGRES_USER: ${POSTGRES_USER:-silieco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silieco}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
